@if (open()) {
  <div class="backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <h3>{{ forced() ? 'Set a new password' : 'Change password' }}</h3>
      @if (forced()) {
        <p class="note">You must set your own password before continuing.</p>
      }

      <form (ngSubmit)="submit()">
        @if (!forced()) {
          <label>
            Current password
            <input type="password" name="current" autocomplete="current-password"
              [ngModel]="currentPassword()" (ngModelChange)="currentPassword.set($event)" />
          </label>
        }
        <label>
          New password
          <input type="password" name="new" autocomplete="new-password"
            [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" />
        </label>
        <label>
          Confirm new password
          <input type="password" name="confirm" autocomplete="new-password"
            [ngModel]="confirm()" (ngModelChange)="confirm.set($event)" />
        </label>
        <p class="hint">At least 6 characters, with an uppercase letter.</p>

        @if (error()) {
          <div class="err">{{ error() }}</div>
        }

        <div class="actions">
          @if (!forced()) {
            <button type="button" class="btn cancel" (click)="cancel()">Cancel</button>
          }
          <button type="submit" class="btn confirm" [disabled]="saving()">
            {{ saving() ? 'Saving…' : 'Save password' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
