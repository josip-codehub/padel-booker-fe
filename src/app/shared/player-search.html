<div class="psearch">
  <input type="text" [ngModel]="query()" (ngModelChange)="onInput($event)"
         placeholder="Add player by name…" autocomplete="off" />
  @if (searching()) {
    <div class="hint">Searching…</div>
  }
  @if (results().length) {
    <ul class="results">
      @for (p of results(); track p.playerId) {
        <li (click)="pick(p)">
          @if (p.image) {
            <img [src]="p.image" referrerpolicy="no-referrer" alt="" />
          } @else {
            <span class="av">{{ (p.name || '?').charAt(0) }}</span>
          }
          <span class="nm">{{ p.name }}</span>
        </li>
      }
    </ul>
  }
</div>
