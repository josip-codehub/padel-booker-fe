<header class="topbar">
  <div class="brand">🎾 Padel Auto-Booker</div>
  @if (authenticated()) {
    <nav>
      <a routerLink="/availability" routerLinkActive="active">Availability</a>
      <a routerLink="/my-reservations" routerLinkActive="active">My Reservations</a>
      <a routerLink="/queue" routerLinkActive="active">Queue</a>
      <a routerLink="/history" routerLinkActive="active">History</a>
      <a routerLink="/settings" routerLinkActive="active">Settings</a>
      @if (isAdmin()) {
        <a routerLink="/fixed-bookings" routerLinkActive="active">Fixed</a>
        <a routerLink="/users" routerLinkActive="active">Users</a>
      }
    </nav>
    <button class="health" (click)="refreshHealth()" title="Click to re-check">
      @if (health(); as h) {
        @if (h.tokenValid) {
          <span class="dot ok"></span> {{ h.user || 'Token OK' }}
        } @else if (!h.configured) {
          <span class="dot warn"></span> Not configured
        } @else {
          <span class="dot err"></span> Token invalid
        }
      } @else {
        <span class="dot"></span> …
      }
    </button>
    <button class="logout" (click)="changePassword()" title="Change your password">Password</button>
    <button class="logout" (click)="logout()" title="Sign out">Sign out</button>
  }
</header>

<main>
  <router-outlet />
</main>

@if (loading()) {
  <div class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Talking to Sporty Plus…</div>
  </div>
}

<app-confirm-dialog />
<app-change-password-dialog />
